<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="880" height="470" viewBox="0 0 880 470">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; }
      .prompt { fill:#3fb950; font-size:15px; font-weight:700; }
      .tilde  { fill:#58a6ff; font-size:15px; }
      .cmd    { fill:#e6edf3; font-size:15px; }
      .name   { fill:#ffffff; font-size:20px; font-weight:700; letter-spacing:0.5px; }
      .pill   { font-size:13px; }
      .dim    { fill:#7d8590; font-size:13px; }
      .status { fill:#e6edf3; font-size:15px; }
    </style>

    <!-- window border gradient -->
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d6cdf" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#30363d"/>
      <stop offset="1" stop-color="#a371f7" stop-opacity="0.7"/>
    </linearGradient>

    <!-- moving highlight on top edge -->
    <linearGradient id="sweep" x1="0" x2="1">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#58a6ff" stop-opacity="1"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>

    <!-- name gradient -->
    <linearGradient id="nameGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#79c0ff"/>
    </linearGradient>

    <!-- dotted grid behind network -->
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#21262d"/>
    </pattern>

    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="win"><rect x="10" y="15" width="860" height="440" rx="14"/></clipPath>

    <!-- typing clips for each command -->
    <clipPath id="t1"><rect x="78" y="78" height="24" width="0"><animate attributeName="width" values="0;9;18;27;36;45;56" calcMode="discrete" begin="0.3s" dur="0.45s" fill="freeze"/></rect></clipPath>
    <clipPath id="t2"><rect x="78" y="153" height="24" width="0"><animate attributeName="width" values="0;18;36;54;72;90;108;130" calcMode="discrete" begin="1.4s" dur="0.55s" fill="freeze"/></rect></clipPath>
    <clipPath id="t3"><rect x="78" y="228" height="24" width="0"><animate attributeName="width" values="0;18;36;54;72;90;108;130" calcMode="discrete" begin="2.5s" dur="0.55s" fill="freeze"/></rect></clipPath>
    <clipPath id="t4"><rect x="78" y="303" height="24" width="0"><animate attributeName="width" values="0;18;36;54;72;90;108;130;150" calcMode="discrete" begin="3.6s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="t5"><rect x="78" y="388" height="24" width="0"><animate attributeName="width" values="0;9;18;27;36;45;56" calcMode="discrete" begin="4.7s" dur="0.45s" fill="freeze"/></rect></clipPath>

    <!-- signal paths through the network -->
    <path id="s1" d="M620 160 L710 210 L800 290"/>
    <path id="s2" d="M620 350 L710 290 L800 210"/>
    <path id="s3" d="M620 255 L710 130 L800 210"/>
    <path id="s4" d="M620 255 L710 370 L800 290"/>
    <path id="s5" d="M620 160 L710 290 L800 210"/>
  </defs>

  <!-- ===== window ===== -->
  <rect x="10" y="15" width="860" height="440" rx="14" fill="#0d1117"/>
  <g clip-path="url(#win)">
    <rect x="560" y="55" width="310" height="400" fill="url(#dots)" opacity="0.9"/>
    <!-- title bar -->
    <rect x="10" y="15" width="860" height="40" fill="#161b22"/>
    <line x1="10" y1="55" x2="870" y2="55" stroke="#21262d"/>
    <!-- sweeping highlight -->
    <rect x="-150" y="15" width="160" height="2" fill="url(#sweep)">
      <animate attributeName="x" from="-150" to="880" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="10" y="15" width="860" height="440" rx="14" fill="none" stroke="url(#border)" stroke-width="1.2"/>

  <circle cx="34" cy="35" r="6" fill="#ff5f57"/>
  <circle cx="54" cy="35" r="6" fill="#febc2e"/>
  <circle cx="74" cy="35" r="6" fill="#28c840"/>
  <text x="440" y="40" text-anchor="middle" class="mono dim">~/about</text>
  <g class="mono">
    <circle cx="806" cy="35" r="3.5" fill="#3fb950">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="816" y="40" class="dim">zsh</text>
  </g>

  <!-- ===== 1: whoami ===== -->
  <g class="mono" opacity="0">
    <set attributeName="opacity" to="1" begin="0.2s" fill="freeze"/>
    <polyline points="41,84 47,89.5 41,95" fill="none" stroke="#3fb950" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="58" y="95" class="tilde">~</text>
    <text x="78" y="95" class="cmd" clip-path="url(#t1)">whoami</text>
  </g>
  <g class="mono" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.4s" fill="freeze"/>
    <text x="40" y="128" class="name" fill="url(#nameGrad)" style="fill:url(#nameGrad)">Ishara Madusanka</text>
  </g>

  <!-- ===== 2: focus ===== -->
  <g class="mono" opacity="0">
    <set attributeName="opacity" to="1" begin="1.3s" fill="freeze"/>
    <polyline points="41,159 47,164.5 41,170" fill="none" stroke="#3fb950" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="58" y="170" class="tilde">~</text>
    <text x="78" y="170" class="cmd" clip-path="url(#t2)">cat focus.txt</text>
  </g>
  <g class="mono pill" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.0s" dur="0.4s" fill="freeze"/>
    <rect x="40"  y="183" width="148" height="28" rx="14" fill="#0b2a55" fill-opacity="0.55" stroke="#1f6feb" stroke-opacity="0.7"/>
    <text x="114" y="202" text-anchor="middle" fill="#79c0ff">Machine Learning</text>
    <rect x="198" y="183" width="117" height="28" rx="14" fill="#0b2a55" fill-opacity="0.55" stroke="#1f6feb" stroke-opacity="0.7"/>
    <text x="256.5" y="202" text-anchor="middle" fill="#79c0ff">Data Science</text>
    <rect x="325" y="183" width="52" height="28" rx="14" fill="#0b2a55" fill-opacity="0.55" stroke="#1f6feb" stroke-opacity="0.7"/>
    <text x="351" y="202" text-anchor="middle" fill="#79c0ff">NLP</text>
  </g>

  <!-- ===== 3: interests ===== -->
  <g class="mono" opacity="0">
    <set attributeName="opacity" to="1" begin="2.4s" fill="freeze"/>
    <polyline points="41,234 47,239.5 41,245" fill="none" stroke="#3fb950" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="58" y="245" class="tilde">~</text>
    <text x="78" y="245" class="cmd" clip-path="url(#t3)">ls interests/</text>
  </g>
  <g class="mono pill" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="3.1s" dur="0.4s" fill="freeze"/>
    <rect x="40"  y="258" width="186" height="28" rx="14" fill="#2a1a4a" fill-opacity="0.55" stroke="#a371f7" stroke-opacity="0.6"/>
    <text x="133" y="277" text-anchor="middle" fill="#d2a8ff">Web &amp; App Development</text>
    <rect x="236" y="258" width="87" height="28" rx="14" fill="#2a1a4a" fill-opacity="0.55" stroke="#a371f7" stroke-opacity="0.6"/>
    <text x="279.5" y="277" text-anchor="middle" fill="#d2a8ff">Robotics</text>
    <rect x="333" y="258" width="117" height="28" rx="14" fill="#2a1a4a" fill-opacity="0.55" stroke="#a371f7" stroke-opacity="0.6"/>
    <text x="391.5" y="277" text-anchor="middle" fill="#d2a8ff">DIY Projects</text>
  </g>

  <!-- ===== 4: ask-me ===== -->
  <g class="mono" opacity="0">
    <set attributeName="opacity" to="1" begin="3.5s" fill="freeze"/>
    <polyline points="41,309 47,314.5 41,320" fill="none" stroke="#3fb950" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="58" y="320" class="tilde">~</text>
    <text x="78" y="320" class="cmd" clip-path="url(#t4)">ask-me --about</text>
  </g>
  <g class="mono pill" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="4.3s" dur="0.4s" fill="freeze"/>
    <rect x="40"  y="333" width="72" height="28" rx="14" fill="#0f2e1a" fill-opacity="0.6" stroke="#3fb950" stroke-opacity="0.6"/>
    <text x="76" y="352" text-anchor="middle" fill="#7ee787">Python</text>
    <rect x="122" y="333" width="42" height="28" rx="14" fill="#0f2e1a" fill-opacity="0.6" stroke="#3fb950" stroke-opacity="0.6"/>
    <text x="143" y="352" text-anchor="middle" fill="#7ee787">ML</text>
    <rect x="174" y="333" width="102" height="28" rx="14" fill="#0f2e1a" fill-opacity="0.6" stroke="#3fb950" stroke-opacity="0.6"/>
    <text x="225" y="352" text-anchor="middle" fill="#7ee787">MERN Stack</text>
  </g>

  <!-- ===== 5: status ===== -->
  <g class="mono" opacity="0">
    <set attributeName="opacity" to="1" begin="4.6s" fill="freeze"/>
    <polyline points="41,394 47,399.5 41,405" fill="none" stroke="#3fb950" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="58" y="405" class="tilde">~</text>
    <text x="78" y="405" class="cmd" clip-path="url(#t5)">status</text>
  </g>
  <g class="mono" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="5.3s" dur="0.4s" fill="freeze"/>
    <circle cx="152" cy="400" r="5" fill="#3fb950"/>
    <circle cx="152" cy="400" r="5" fill="none" stroke="#3fb950">
      <animate attributeName="r" values="5;11" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="166" y="405" class="status">Open to collaborating on AI/ML projects<tspan dx="6" fill="#58a6ff" font-weight="700">_<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/></tspan></text>
  </g>

  <!-- ===== neural network ===== -->
  <g stroke="#1f6feb" stroke-opacity="0.28" stroke-width="1.1">
    <!-- input -> hidden -->
    <line x1="620" y1="160" x2="710" y2="130"/><line x1="620" y1="160" x2="710" y2="210"/>
    <line x1="620" y1="160" x2="710" y2="290"/><line x1="620" y1="160" x2="710" y2="370"/>
    <line x1="620" y1="255" x2="710" y2="130"/><line x1="620" y1="255" x2="710" y2="210"/>
    <line x1="620" y1="255" x2="710" y2="290"/><line x1="620" y1="255" x2="710" y2="370"/>
    <line x1="620" y1="350" x2="710" y2="130"/><line x1="620" y1="350" x2="710" y2="210"/>
    <line x1="620" y1="350" x2="710" y2="290"/><line x1="620" y1="350" x2="710" y2="370"/>
    <!-- hidden -> output -->
    <line x1="710" y1="130" x2="800" y2="210"/><line x1="710" y1="130" x2="800" y2="290"/>
    <line x1="710" y1="210" x2="800" y2="210"/><line x1="710" y1="210" x2="800" y2="290"/>
    <line x1="710" y1="290" x2="800" y2="210"/><line x1="710" y1="290" x2="800" y2="290"/>
    <line x1="710" y1="370" x2="800" y2="210"/><line x1="710" y1="370" x2="800" y2="290"/>
  </g>

  <!-- travelling signals -->
  <g fill="#79c0ff" filter="url(#glow)">
    <circle r="3"><animateMotion dur="2.4s" begin="0s"   repeatCount="indefinite"><mpath xlink:href="#s1"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="2.4s" begin="0.5s" repeatCount="indefinite"><mpath xlink:href="#s2"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="2.4s" begin="1.0s" repeatCount="indefinite"><mpath xlink:href="#s3"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="2.4s" begin="1.5s" repeatCount="indefinite"><mpath xlink:href="#s4"/></animateMotion></circle>
    <circle r="3" fill="#d2a8ff"><animateMotion dur="2.4s" begin="2.0s" repeatCount="indefinite"><mpath xlink:href="#s5"/></animateMotion></circle>
  </g>

  <!-- nodes -->
  <g stroke="#58a6ff" stroke-width="2" fill="#0d1f3c">
    <circle cx="620" cy="160" r="11"/><circle cx="620" cy="255" r="11"/><circle cx="620" cy="350" r="11"/>
    <circle cx="710" cy="130" r="11"/><circle cx="710" cy="210" r="11"/>
    <circle cx="710" cy="290" r="11"/><circle cx="710" cy="370" r="11"/>
  </g>
  <g stroke="#58a6ff" stroke-width="2" filter="url(#glow)">
    <circle cx="800" cy="210" r="12" fill="#1f3b73">
      <animate attributeName="fill" values="#1f3b73;#2d6cdf;#1f3b73" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="290" r="12" fill="#1f3b73">
      <animate attributeName="fill" values="#1f3b73;#2d6cdf;#1f3b73" dur="2.4s" begin="0s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
